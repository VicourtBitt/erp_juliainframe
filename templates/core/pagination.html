{% load brl %}{% if page.has_other_pages %}
<nav aria-label="Paginação"><ul class="pagination pagination-sm">
  {% if page.has_previous %}<li class="page-item"><a class="page-link" href="?{% query_replace page=page.previous_page_number %}">&laquo;</a></li>{% endif %}
  <li class="page-item disabled"><span class="page-link">Página {{ page.number }} de {{ page.paginator.num_pages }}</span></li>
  {% if page.has_next %}<li class="page-item"><a class="page-link" href="?{% query_replace page=page.next_page_number %}">&raquo;</a></li>{% endif %}
</ul></nav>{% endif %}
